[project]
name = "qr-market-clean-main-raiz"
version = "0.1.0"
description = "desafio geração qr code"
authors = [
    {name = "Rafaellima1412",email = "rafaellima1412@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
package-mode = false
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "qrcode (>=8.2,<9.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pillow (>=11.2.1,<12.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (<4.1.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "dependency-injector (>=4.48.1,<5.0.0)",
    "password (>=0.2,<0.3)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "alembic (>=1.16.4,<2.0.0)",
    "geoalchemy2 (>=0.18.0,<0.19.0)",
]


[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-cov = ">=6.0.0,<7.0.0"
httpx = ">=0.28.0,<0.29.0"
faker = ">=33.0.0,<34.0.0"
ruff = ">=0.8.0,<0.9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that hit a real PostgreSQL database",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"