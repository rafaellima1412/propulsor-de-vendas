<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Propulsor de Venda{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Seu CSS base -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">

  {% block head %}{% endblock %}
</head>
<body>


  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-black" href="/">Propulsor de Venda</a>

      <div class="d-flex align-items-center gap-2">
        {% if request.url.path.startswith('/campanhas/view') or request.url.path.startswith('/campanhas/cadastro') %}
          <a href="/pagina/inicial/" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Voltar para Dashboard
          </a>
        {% endif %}

        <form method="get" action="/user/logout">
          <button class="btn btn-outline-danger" type="submit">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <main class="container py-5">
    <div class="content-container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Botão flutuante para alternar tema -->
  <button id="theme-toggle" class="btn btn-outline-secondary theme-floating-btn">🌙</button>

  <!-- Script para alternar tema -->
  <script>
    (function () {
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");

      function applyTheme(theme) {
        root.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
      }

      const savedTheme = localStorage.getItem("theme") || "light";
      applyTheme(savedTheme);

      themeToggle.addEventListener("click", () => {
        const currentTheme = root.getAttribute("data-theme");
        const newTheme = currentTheme === "light" ? "dark" : "light";
        applyTheme(newTheme);
      });
    })();
  </script>
</body>
</html>
