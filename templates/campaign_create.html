{% extends "base.html" %}

{% block title %}Criar Nova Campanha{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', path='css/campanha.css') }}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 form-container">

    <h1 class="mb-4 form-title text-center">
      <i class="bi bi-plus-circle text-success"></i> Criar Nova Campanha
    </h1>

    {% if errors %}
      <div class="alert alert-danger">
        <i class="bi bi-x-circle-fill me-2"></i> Erros encontrados:
        <ul class="mb-0">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post" action="/campanhas/create" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="title" class="form-label">Título:</label>
        <input type="text" name="title" id="title" required class="form-control" value="{{ title or '' }}">
      </div>

<!--      <div class="mb-3">-->
<!--        <label for="cpf" class="form-label">CPF:</label>-->
<!--        <input type="text" name="cpf" id="cpf" required class="form-control" value="{{ cpf or '' }}">-->
<!--      </div>-->

<!--      <div class="mb-3">-->
<!--        <label for="matricula" class="form-label">Matrícula:</label>-->
<!--        <input type="text" name="matricula" id="matricula" required class="form-control" value="{{ matricula or '' }}">-->
<!--      </div>-->

      <div class="mb-3">
        <label for="folder_image" class="form-label">Imagem do Folder:</label>
        <input type="file" name="folder_image" id="folder_image" required accept="image/*" class="form-control">
      </div>

      <div class="mb-5">
        <label for="paragraph" class="form-label">Parágrafo:</label>
        <textarea name="paragraph" id="paragraph" required class="form-control" rows="5">{{ paragraph or '' }}</textarea>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">
          <i class="bi bi-check-circle me-1"></i> Criar Campanha
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
