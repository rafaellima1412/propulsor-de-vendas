{% extends "base.html" %}

{% block title %}Login - Propulsor de Venda{% endblock %}

{% block content %}
  <!-- Formulário de Login -->
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 login-container">
      <h2 class="text-center mb-4 form-title">
        <i class="bi bi-person-circle text-primary me-2"></i>Login
      </h2>

      <form method="post" action="/user/cadastro">
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input type="text" class="form-control" name="username" id="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control" name="password" id="password" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div></div>
          <a href="/user/forgot-password" class="small text-decoration-none">Esqueci minha senha</a>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4 mb-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
