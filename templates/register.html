
{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">Cadastro</h2>
    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}
  <form method="post" action="/user/register">

    <!-- Nome -->
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" name="username" id="nome" class="form-control" required>
    </div>
      <div class="mb-3">
        <label>Nome completo</label>
        <input type="text" name="full_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>CPF</label>
        <input type="text" name="cpf" class="form-control" required>
      </div>
          <div class="mb-3">
        <label>Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
    <!-- Cargo -->
    <div class="mb-3">
      <label for="role" class="form-label">Cargo</label>
      <select name="role" id="role" class="form-select" required onchange="onCargoChange()">
        <option value="">Selecione</option>
        <option value="coo">COO</option>
        <option value="gerente">Gerente</option>
        <option value="colaborador">Colaborador</option>
      </select>
    </div>

    <!-- Se COO, escolhe gerente -->
    <div id="gerente-select" class="mb-3 d-none">
      <label for="subordinado-gerente" class="form-label">Gerentes</label>
      <select name="subordinado_id" id="subordinado-gerente" class="form-select">
        {% for g in gerentes %}
          <option value="{{ g.id }}">{{ g.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Se Gerente, escolhe ou cria time -->
    <div id="time-gerente-section" class="d-none">
      <div class="mb-3">
        <label for="time-existente" class="form-label">Selecionar Time Existente</label>
        <select name="time_existente_id" id="time-existente" class="form-select">
          <option value="">-- Nenhum --</option>
          {% for t in times %}
            <option value="{{ t.id }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label for="novo-time" class="form-label">Ou Criar Novo Time</label>
        <input type="text" name="novo_time" id="novo-time" class="form-control" placeholder="Ex: Time 3">
      </div>
    </div>

    <!-- Se colaborador, escolhe time -->
    <div id="time-colaborador-section" class="mb-3 d-none">
      <label for="time-colaborador" class="form-label">Selecione seu Time</label>
      <select name="time_id" id="time-colaborador" class="form-select">
        {% for t in times %}
          <option value="{{ t.id }}">{{ t.name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Botão -->
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary">Cadastrar</button>
    </div>
  </form>
</div>
<script>
async function onCargoChange() {
  const role = document.getElementById("role").value;

  const gerenteDiv = document.getElementById("gerente-select");
  const timeGerenteDiv = document.getElementById("time-gerente-section");
  const timeColabDiv = document.getElementById("time-colaborador-section");

  gerenteDiv.classList.add("d-none");
  timeGerenteDiv.classList.add("d-none");
  timeColabDiv.classList.add("d-none");

  if (role === "coo") {
    const res = await fetch("/user/gerentes");
    const gerentes = await res.json();

    const select = document.getElementById("subordinado-gerente");
    select.innerHTML = "";
    gerentes.forEach(g => {
      const opt = document.createElement("option");
      opt.value = g.id;
      opt.textContent = g.full_name;
      select.appendChild(opt);
    });

    gerenteDiv.classList.remove("d-none");
  }

  else if (role === "gerente") {
    const res = await fetch("/times/list");
    const times = await res.json();
    const select = document.getElementById("time-existente");

    select.innerHTML = `<option value="">-- Nenhum --</option>`;
    times.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.name;
      select.appendChild(opt);
    });

    timeGerenteDiv.classList.remove("d-none");
  }

  else if (role === "colaborador") {
    const res = await fetch("/times/list");
    const times = await res.json();
    document.getElementById("time-existente").disabled = true;
    const select = document.getElementById("time-colaborador");
    select.innerHTML = `<option value="">-- Nenhum --</option>`;
    times.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.name;
      select.appendChild(opt);
    });

    timeColabDiv.classList.remove("d-none");
  }
}
</script>

{% endblock %}
