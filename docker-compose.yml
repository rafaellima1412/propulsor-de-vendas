services:
  db:
    image: postgis/postgis:16-3.4
    container_name: propulsor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propulsor
    ports:
      - "5432:5432"
    volumes:
      - propulsor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propulsor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  propulsor-db-data: